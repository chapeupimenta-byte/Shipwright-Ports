name: Android Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: djvdw7f2ro/android-builder-soh:v1.0.4
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Write local.properties
        run: |
          echo sdk.dir=${ANDROID_SDK_ROOT} > Android/local.properties
          echo ndk.dir=${ANDROID_NDK_HOME} >> Android/local.properties

      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y $(cat .github/workflows/apt-deps.txt)

      - name: Generate soh.o2r
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --target GenerateSohOtr --parallel
          cp soh/soh.o2r Android/app/src/main/assets/soh.o2r

      - name: Build optimized test APK
        env:
          GIT_TAG: test-${{ github.run_number }}
          CFLAGS: "-O3 -DNDEBUG"
          CXXFLAGS: "-O3 -DNDEBUG"
        run: |
          cd Android && ./gradlew assembleDebug \
            -PsohApplicationId=com.linkzenic.soh.touchcontroltest \
            -PsohConfigFile=shipofharkinian-touchcontroltest.json \
            -DCMAKE_BUILD_TYPE=Release

      - name: Prepare APK artifact
        run: |
          APK=$(find Android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" soh-test-${{ github.run_number }}.apk
          sha256sum soh-test-${{ github.run_number }}.apk > soh-test-${{ github.run_number }}.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: soh-test-apk
          path: |
            soh-test-${{ github.run_number }}.apk
            soh-test-${{ github.run_number }}.apk.sha256
          if-no-files-found: error
          retention-days: 14

